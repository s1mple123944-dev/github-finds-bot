name: Daily reel

# Каждый вечер после третьего поста собирает ролик «3 находки с GitHub»
# для TikTok / Reels и присылает его владельцу в личку.
on:
  schedule:
    - cron: "13 19 * * *"   # 22:13 по Минску
  workflow_dispatch:
    inputs:
      posts:
        description: "Файлы из sent/ через запятую (пусто = 3 последних)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: send-posts
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --quiet pillow

      - name: Build and send reel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          POSTS: ${{ inputs.posts }}
        run: |
          if [ -n "$POSTS" ]; then
            python3 reel.py --send --posts "$POSTS"
          else
            python3 reel.py --send
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "github-finds-bot"
          git config user.email "github-finds-bot@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet && exit 0
          git commit -m "bot: ролик отправлен [skip ci]"
          git pull --rebase
          git push
